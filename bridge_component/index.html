<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      background: transparent;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
      box-sizing: border-box;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .connected {
      background-color: #f0fdf4;
      color: #15803d;
      border: 1px solid #86efac;
    }
    .bridge-only {
      background-color: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .disconnected {
      background-color: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }
    .pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .pulse-green { background: #22c55e; box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.4); }
    .pulse-blue { background: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4); }
    .pulse-yellow { background: #eab308; box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.4); }
  </style>
</head>
<body>
  <div id="status-box">
    <div class="status-badge disconnected">
      <span class="pulse pulse-yellow"></span> <b>STACONT Bridge Kontrol Ediliyor...</b>
    </div>
  </div>

  <script>
    function sendToStreamlit(data) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: data
      }, "*");
    }

    function setHeight(h) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: h || 48
      }, "*");
    }

    async function queryBridge(endpoint, params) {
      let url = "http://127.0.0.1:8765" + endpoint;
      if (params && Object.keys(params).length > 0) {
        const qs = new URLSearchParams(params).toString();
        url += "?" + qs;
      }
      try {
        const response = await fetch(url, { 
          method: "GET",
          headers: { "Accept": "application/json" }
        });
        if (response.ok) {
          return await response.json();
        } else {
          return { success: false, etabs_connected: false, error: "HTTP " + response.status };
        }
      } catch (err) {
        return { success: false, etabs_connected: false, error: err.message };
      }
    }

    async function onRender(event) {
      const args = event.data.args || {};
      const action = args.action || "status";
      const endpoint = args.endpoint || "/status";
      const params = args.params || {};

      if (action === "fetch_bundle") {
        const box = document.getElementById("status-box");
        box.innerHTML = `
          <div style="color: #2563eb; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 8px;">
            <span class="pulse pulse-blue"></span> <b>ETABS'ten veriler alınıyor...</b>
          </div>`;
        setHeight(40);
        const res = await queryBridge(endpoint, params);
        sendToStreamlit({ bundle_action: args.bundle_name, ...res });
        return;
      }

      // Varsayılan: Status kontrolü
      const result = await queryBridge("/status");
      const box = document.getElementById("status-box");

      if (result && result.status === "ok" && result.etabs_connected) {
        box.innerHTML = `
          <div class="status-badge connected">
            <span class="pulse pulse-green"></span> 
            <b>ETABS Bağlandı:</b> ${result.model_name || 'Aktif Model'}
          </div>`;
        
        // Kombinasyonları, Yük durumlarını ve Katları çek
        const combosRes = await queryBridge("/api/combinations");
        const casesRes = await queryBridge("/api/load_cases");
        const storiesRes = await queryBridge("/api/stories");

        const fullData = {
          ...result,
          combinations: (combosRes && combosRes.combinations) ? combosRes.combinations : [],
          load_cases: (casesRes && casesRes.load_cases) ? casesRes.load_cases : [],
          stories: (storiesRes && storiesRes.stories) ? storiesRes.stories : []
        };
        sendToStreamlit(fullData);
      } else if (result && result.status === "disconnected" && result.error && result.error.includes("ETABS")) {
        box.innerHTML = `
          <div class="status-badge bridge-only">
            <span class="pulse pulse-blue"></span> 
            <b>STACONT Bridge Bağlı:</b> Lütfen bilgisayarınızda ETABS'i ve analiz modelinizi açın.
          </div>`;
        sendToStreamlit(result);
      } else {
        box.innerHTML = `
          <div class="status-badge disconnected">
            <span class="pulse pulse-yellow"></span> 
            <b>ETABS Bağlantısı Bekleniyor:</b> Yerel bilgisayarınızda STACONT Bridge'i çalıştırınız.
          </div>`;
        sendToStreamlit({ etabs_connected: false });
      }
      setHeight(50);
    }

    window.addEventListener("message", function(event) {
      if (event.data.type === "streamlit:render") {
        onRender(event);
      }
    });

    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");
  </script>
</body>
</html>
