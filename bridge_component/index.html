<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      background: transparent;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
      box-sizing: border-box;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .connected {
      background-color: #f0fdf4;
      color: #15803d;
      border: 1px solid #86efac;
    }
    .bridge-only {
      background-color: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .disconnected {
      background-color: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }
    .pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .pulse-green { background: #22c55e; box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.4); }
    .pulse-blue { background: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4); }
    .pulse-yellow { background: #eab308; box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.4); }
  </style>
</head>
<body>
  <div id="status-box">
    <div class="status-badge disconnected">
      <span class="pulse pulse-yellow"></span> <b>STACONT Bridge Kontrol Ediliyor...</b>
    </div>
  </div>

  <script>
    let lastStatusConnected = null;

    function sendToStreamlit(data) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: data
      }, "*");
    }

    function setHeight(h) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: h || 50
      }, "*");
    }

    async function queryBridge(endpoint, params) {
      let url = "http://127.0.0.1:8765" + endpoint;
      if (params && Object.keys(params).length > 0) {
        const qs = new URLSearchParams(params).toString();
        url += "?" + qs;
      }
      try {
        const response = await fetch(url, { 
          method: "GET",
          headers: { "Accept": "application/json" }
        });
        if (response.ok) {
          return await response.json();
        } else {
          return { success: false, etabs_connected: false, bridge_running: false, error: "HTTP " + response.status };
        }
      } catch (err) {
        return { success: false, etabs_connected: false, bridge_running: false, error: err.message };
      }
    }

    async function updateStatus() {
      const result = await queryBridge("/status");
      const box = document.getElementById("status-box");

      if (result && result.status === "ok" && result.etabs_connected) {
        // Durum 1: Hem Bridge hem ETABS bağlı
        box.innerHTML = `
          <div class="status-badge connected">
            <span class="pulse pulse-green"></span> 
            <b>ETABS Bağlandı:</b> ${result.model_name || 'Aktif Model'}
          </div>`;
        if (lastStatusConnected !== true) {
          lastStatusConnected = true;
          sendToStreamlit(result);
        }
      } else if (result && result.status === "disconnected" && result.error && result.error.includes("ETABS")) {
        // Durum 2: Bridge çalışıyor ama ETABS açık değil
        box.innerHTML = `
          <div class="status-badge bridge-only">
            <span class="pulse pulse-blue"></span> 
            <b>STACONT Bridge Bağlı:</b> Lütfen bilgisayarınızda ETABS'i ve analiz modelinizi açın.
          </div>`;
        if (lastStatusConnected !== false) {
          lastStatusConnected = false;
          sendToStreamlit(result);
        }
      } else {
        // Durum 3: Bridge çalışmıyor
        box.innerHTML = `
          <div class="status-badge disconnected">
            <span class="pulse pulse-yellow"></span> 
            <b>ETABS Bağlantısı Bekleniyor:</b> Yerel bilgisayarınızda STACONT Bridge'i çalıştırınız.
          </div>`;
        if (lastStatusConnected !== false) {
          lastStatusConnected = false;
          sendToStreamlit({ etabs_connected: false });
        }
      }
      setHeight(52);
    }

    // İlk render ve 3 saniyede bir otomatik canlı kontrol
    updateStatus();
    setInterval(updateStatus, 3000);

    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");
  </script>
</body>
</html>
