<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STACONT | Betonarme Yapısal Analiz ve Kontrol Platformu - Axial</title>
    <meta name="description" content="TBDY 2018 ve TS 500 uyumlu otomatik betonarme yapı elemanları analiz ve kontrol aracı.">
    <link rel="icon" href="https://img.icons8.com/color/48/hammer.png" type="image/png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            flex-grow: 1;
            display: block;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Buradaki URL'yi Streamlit Cloud'dan alacağınız adres ile değiştiriniz -->
        <iframe 
            id="stacont-frame"
            src="https://stacontrol.streamlit.app/?embed=true&embed_options=show_colored_line,light_theme" 
            allow="clipboard-read; clipboard-write"
            loading="lazy">
        </iframe>
    </div>
</body>
</html>
