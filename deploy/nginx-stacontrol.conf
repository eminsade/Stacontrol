# ===========================================================================
#  Stacontrol - nginx ters vekil yapilandirmasi
#  __DOMAIN__ yer tutucusunu kendi alan adinizla degistirin; deploy/kurulum.sh
#  bunu otomatik yapar. Sonra sites-enabled/ altina baglayin.
#
#  Iki arka uc vardir:
#    /         -> Streamlit web uygulamasi (8501), WebSocket gerektirir
#    /bridge/  -> Kopru API'si (8500), UZUN istekler gerektirir
# ===========================================================================

upstream stacontrol_web    { server 127.0.0.1:8501; keepalive 32; }
upstream stacontrol_bridge { server 127.0.0.1:8500; keepalive 32; }

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ajan sonuclari sikistirilmis olarak 64 MB'a kadar cikabilir.
    client_max_body_size 64m;

    # -------------------------------------------------------------------
    # Ajan paketi (buyuk dosya -- nginx'e birakmak Streamlit'ten verimlidir)
    # AGENT_DOWNLOAD_URL=https://__DOMAIN__/indir/StacontrolAgent.zip
    # -------------------------------------------------------------------
    location /indir/ {
        alias /opt/stacontrol/static/;
        add_header Content-Disposition "attachment";
        expires 1h;
    }

    # -------------------------------------------------------------------
    # Kopru API'si
    # -------------------------------------------------------------------
    location /bridge/ {
        # Sondaki egik cizgi "/bridge" onekini kirpar:
        # /bridge/api/agent/poll -> /api/agent/poll
        proxy_pass http://stacontrol_bridge/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # KRITIK: ajan 25 sn uzun yoklama yapar, buyuk modellerde tablo
        # okuma birkac dakika surebilir. Bu sureler kisa olursa istekler
        # 504 ile kesilir.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Uzun yoklama ve buyuk govdeler icin tamponlama kapali.
        proxy_buffering         off;
        proxy_request_buffering off;
    }

    # -------------------------------------------------------------------
    # Streamlit
    # -------------------------------------------------------------------
    location / {
        proxy_pass http://stacontrol_web;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit WebSocket uzerinden calisir; bu iki baslik zorunludur.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
